      <span class="brand-text">藝境裝潢材料行</span>
    </a>
    <div class="sidebar-nav">
      <a href="index.html" class="nav-item" data-page="index.html" title="總覽">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span class="nav-label">總覽</span>
      </a>
      <a href="products.html" class="nav-item" data-page="products.html" title="商品管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <span class="nav-label">商品管理</span>
      </a>
      <a href="orders.html" class="nav-item" data-page="orders.html" title="單據管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

    <button class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true">
      <svg class="chevron-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>

  <div class="container">
    <div class="d-flex justify-between align-center mb-4">
      <h2>商品管理</h2>
      <button class="btn btn-primary" id="btn-add-product">新增商品</button>
    </div>

    <div class="glass-card mb-4">
      <div class="form-group mb-0">
        <input type="text" id="search-input" class="form-control" placeholder="搜尋商品名稱、編號、條碼或分類...">
      </div>
    </div>

    <div class="glass-card">
      <div class="table-responsive">
        <table id="products-table">
          <thead>
            <tr>
              <th>編號</th>
              <th>商品名稱</th>
              <th>分類</th>
              <th>庫存量</th>
              <th>進價</th>
              <th>售價</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="8" class="empty-state">載入中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="btn btn-outline" id="btn-prev-page" disabled>上一頁</button>
        <span id="page-info">第 1 頁</span>
        <button class="btn btn-outline" id="btn-next-page" disabled>下一頁</button>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">新增商品</h3>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="product-form">
          <input type="hidden" id="product-id">
          <div class="grid grid-cols-2 gap-3">
            <div class="form-group">
              <label>編號 (必填)</label>
              <input type="text" id="product-sku" class="form-control" required>
            </div>
            <div class="form-group">
              <label>條碼</label>
              <input type="text" id="product-barcode" class="form-control">
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>商品名稱 (必填)</label>
              <input type="text" id="product-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label>分類</label>
              <input type="text" id="product-category" class="form-control">
            </div>
            <div class="form-group">
              <label>單位</label>
              <input type="text" id="product-unit" class="form-control" value="個">
            </div>
            <div class="form-group">
              <label>進價</label>
              <input type="number" id="product-cost" class="form-control" min="0" step="0.01" value="0">
            </div>
            <div class="form-group">
              <label>售價</label>
              <input type="number" id="product-price" class="form-control" min="0" step="0.01" value="0">
            </div>
            <div class="form-group">
              <label>安全庫存</label>
              <input type="number" id="product-safety-stock" class="form-control" min="0" value="0">
            </div>
            <div class="form-group">
              <label>儲位</label>
              <input type="text" id="product-location" class="form-control">
            </div>
            <div class="form-group">
              <label>稅別</label>
              <select id="product-tax-type" class="form-control">
                <option value="taxable">應稅</option>
                <option value="free">免稅</option>
              </select>
            </div>
            <div class="form-group">
              <label>狀態</label>
              <select id="product-is-active" class="form-control">
                <option value="true">啟用</option>
                <option value="false">停用</option>
              </select>
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>規格</label>
              <input type="text" id="product-spec" class="form-control">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline close-btn">取消</button>
        <button class="btn btn-primary" id="btn-save-product">儲存</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/products.js"></script>
</body>
</html>
