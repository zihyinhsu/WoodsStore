  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Product Row Expansion Styles */
    #products-table tbody tr.clickable-row {
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    #products-table tbody tr.clickable-row:hover {
      background-color: rgba(0, 0, 0, 0.02);
    }
    #cost-modal .modal-content {
      max-width: 860px;
      width: 92%;
    }
    .cost-analysis-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .cost-analysis-header h4 {
      margin: 0;
      font-size: 1.25rem;
      color: #1f1f1f;
    }
    /* .date-controls / .metric-card* / .records-table 已搬到 css/style.css：
       客戶毛利分析 modal（總覽與往來對象）用的是同一組元件，留在這裡會被複製第二份。 */
  </style>
  <script>
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  </script>
</head>
<body>

    <button class="btn-menu" aria-label="開啟選單" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <a href="index.html" class="mobile-brand">藝境裝潢材料行</a>
  </div>

    <div class="sidebar-backdrop"></div>
  <nav class="sidebar" aria-label="主選單">
    <a href="index.html" class="sidebar-brand">
      <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h13"></path><path d="M6 10h13"></path><path d="M19 4a2 3 0 0 1 0 6"></path><ellipse cx="6" cy="7" rx="2" ry="3"></ellipse><path d="M6 14h13"></path><path d="M6 20h13"></path><path d="M19 14a2 3 0 0 1 0 6"></path><ellipse cx="6" cy="17" rx="2" ry="3"></ellipse></svg>
      <span class="brand-text">藝境裝潢材料行</span>
    </a>
    <div class="sidebar-nav">
      <a href="index.html" class="nav-item" data-page="index.html" title="總覽">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span class="nav-label">總覽</span>
      </a>
      <a href="products.html" class="nav-item" data-page="products.html" title="商品管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <span class="nav-label">商品管理</span>
      </a>
      <a href="orders.html" class="nav-item" data-page="orders.html" title="單據管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span class="nav-label">單據管理</span>
      </a>
      <a href="payments.html" class="nav-item" data-page="payments.html" title="收款管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><line x1="12" y1="18" x2="12" y2="6"></line></svg>
        <span class="nav-label">收款管理</span>
      </a>
      <a href="statement.html" class="nav-item" data-page="statement.html" title="對帳單">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14h6"></path><path d="M9 18h6"></path><path d="M9 10h6"></path></svg>
        <span class="nav-label">對帳單</span>
      </a>
      <a href="partners.html" class="nav-item" data-page="partners.html" title="往來對象">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span class="nav-label">往來對象</span>
      </a>
    </div>
    <button class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true">
      <svg class="chevron-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </nav>

  <div class="container">
    <div class="d-flex justify-between align-center mb-4">
      <h2>商品管理</h2>
      <button class="btn btn-primary" id="btn-add-product">新增商品</button>
    </div>

    <div class="tabs" role="tablist" aria-label="商品檢視">
      <button class="tab-btn active" data-view="all" role="tab" aria-selected="true">所有商品</button>
      <button class="tab-btn" data-view="low-stock" role="tab" aria-selected="false">
        庫存不足<span class="tab-count" id="low-stock-count" hidden></span>
      </button>
    </div>

    <div class="glass-card mb-4">
      <div class="d-flex gap-3" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
        <div class="form-group mb-0" style="flex: 1; min-width: 200px;">
          <input type="text" id="search-input" class="form-control" placeholder="搜尋商品名稱、編號或分類...">
        </div>
        <div class="form-group mb-0" style="flex: 0 1 160px;">
          <input type="text" id="location-input" class="form-control" placeholder="儲位...">
        </div>
        <div class="form-group mb-0">
          <select id="status-filter" class="form-control" style="width: auto;">
            <option value="active" selected>啟用</option>
            <option value="inactive">停用</option>
            <option value="all">全部</option>
          </select>
        </div>
      </div>
    </div>

    <div class="glass-card">
      <div class="table-responsive">
        <table id="products-table">
          <thead>
            <tr>
              <th>編號</th>
              <th>商品名稱</th>
              <th>分類</th>
              <th>庫存量</th>
              <th>儲位</th>
              <th>進價</th>
              <th>售價</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="9" class="empty-state">載入中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="btn btn-outline" id="btn-prev-page" disabled>上一頁</button>
        <span id="page-info">第 1 頁</span>
        <button class="btn btn-outline" id="btn-next-page" disabled>下一頁</button>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">新增商品</h3>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="product-form">
          <input type="hidden" id="product-id">
          <div class="grid grid-cols-2 gap-3">
            <div class="form-group" style="grid-column: span 2;">
              <label for="product-sku">編號</label>
              <input type="text" id="product-sku" class="form-control" placeholder="儲存後自動產生">
              <small id="product-sku-hint" class="text-muted">留空將自動編號（P0001 起）</small>
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>商品名稱 (必填)</label>
              <input type="text" id="product-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label>分類</label>
              <input type="text" id="product-category" class="form-control">
            </div>
            <div class="form-group">
              <label>單位</label>
              <input type="text" id="product-unit" class="form-control" value="個">
            </div>
            <div class="form-group">
              <label>進價</label>
              <input type="number" id="product-cost" class="form-control" min="0" step="any" value="0">
            </div>
            <div class="form-group">
              <label>售價</label>
              <input type="number" id="product-price" class="form-control" min="0" step="any" value="0">
            </div>
            <div class="form-group">
              <label>安全庫存</label>
              <input type="number" id="product-safety-stock" class="form-control" min="0" value="0">
            </div>
            <div class="form-group">
              <label>儲位</label>
              <input type="text" id="product-location" class="form-control">
            </div>
            <div class="form-group">
              <label>稅別</label>
              <select id="product-tax-type" class="form-control">
                <option value="taxable">應稅</option>
                <option value="free">免稅</option>
              </select>
            </div>
            <div class="form-group">
              <label>狀態</label>
              <select id="product-is-active" class="form-control">
                <option value="true">啟用</option>
                <option value="false">停用</option>
              </select>
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>規格</label>
              <input type="text" id="product-spec" class="form-control">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline close-btn">取消</button>
        <button class="btn btn-primary" id="btn-save-product">儲存</button>
      </div>
    </div>
  </div>

  <!-- Stock Adjustment Modal -->
  <div class="modal-overlay" id="adjust-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="adjust-modal-title">庫存調整</h3>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="adjust-form">
          <div class="form-group">
            <label>目前庫存</label>
            <div id="adjust-current-stock" style="padding: 0.5rem 0; font-weight: 500;">-</div>
          </div>
          <div class="form-group">
            <label for="adjust-count">盤點後數量 (必填)</label>
            <input type="number" id="adjust-count" class="form-control" step="1" min="0" required>
            <small id="adjust-diff-hint" class="text-muted">輸入盤點後的實際數量，系統會自動算出差額</small>
          </div>
          <div class="form-group">
            <label for="adjust-date">日期</label>
            <input type="date" id="adjust-date" class="form-control">
          </div>
          <div class="form-group">
            <label for="adjust-note">備註</label>
            <input type="text" id="adjust-note" class="form-control" placeholder="例如：年中盤點盤盈、破損報廢">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline close-btn">取消</button>
        <button class="btn btn-primary" id="btn-save-adjust">確認調整</button>
      </div>
    </div>
  </div>

  <!-- Cost Analysis Modal -->
  <div class="modal-overlay" id="cost-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="cost-modal-title">進出貨成本分析</h3>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="cost-analysis-header">
          <div class="date-controls">
            <input type="date" class="cost-date-from">
            <span>至</span>
            <input type="date" class="cost-date-to">
            <button class="btn btn-outline btn-quick-date" data-range="thisMonth">本月</button>
            <button class="btn btn-outline btn-quick-date" data-range="lastMonth">上月</button>
            <button class="btn btn-outline btn-quick-date" data-range="last30Days">近30天</button>
            <button class="btn btn-outline btn-quick-date" data-range="all">累計</button>
          </div>
        </div>
        <div class="cost-analysis-content">載入中...</div>
        <!-- 分頁列放在 cost-analysis-content 之外：該區塊每次查詢都會整個重繪，
             按鈕若放在裡面，綁定的事件監聽器會跟著舊 DOM 一起被丟掉。 -->
        <div class="pagination" id="cost-pagination" hidden>
          <button class="btn btn-outline" id="btn-cost-prev-page" disabled>上一頁</button>
          <span id="cost-page-info">第 1 頁</span>
          <button class="btn btn-outline" id="btn-cost-next-page" disabled>下一頁</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/products.js"></script>
</body>
</html>
