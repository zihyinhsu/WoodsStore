<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>對帳單 - 藝境裝潢材料行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .statement-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .statement-controls .form-group {
      margin-bottom: 0;
    }
    /* 讓按鈕垂直 padding 與 .form-control（0.75rem）一致，使按鈕與日期 input 等高、上下對齊 */
    .statement-controls .btn {
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    .statement-hint {
      color: var(--text-muted, #718096);
      margin-bottom: 1rem;
    }
    .statement-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .statement-toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .statement-toolbar[hidden] {
      display: none;
    }
    .select-all-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      cursor: pointer;
      user-select: none;
    }
    /* 核取方塊外觀改用全站共用的 .checkbox（見 style.css），不再自訂 input 尺寸 */
    .select-count {
      color: var(--text-muted, #718096);
      font-size: 0.9rem;
    }
    .statement-tab {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      padding: 0 0.5rem 0 0.75rem;
      border: 1px solid var(--border-light, #cbd5e0);
      background: #fff;
      color: #2d3748;
      font: inherit;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .statement-tab:hover {
      background: #edf2f7;
    }
    .statement-tab.is-active {
      background: #2b6cb0;
      border-color: #2b6cb0;
      color: #fff;
      font-weight: 600;
    }
    /* .tab-check 外觀改用全站共用的 .checkbox（見 style.css） */
    .tab-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      padding: 0 0.5rem;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .statement-tab .tab-balance {
      font-size: 0.85rem;
      opacity: 0.85;
    }
    .statement-section[hidden] {
      display: none;
    }
    .statement-preview {
      background: white;
      padding: 2rem;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-hard);
      color: black;
    }
    .statement-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .statement-header h1 {
      justify-content: center;
      margin-bottom: 0.5rem;
    }
    .statement-header h1::before, .statement-header h2::before {
      display: none;
    }
    .statement-header h2 {
      justify-content: center;
      font-size: 1.5rem;
      color: #333;
    }
    .customer-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      border: 1px solid black;
      padding: 1rem;
    }
    .customer-info p {
      margin-bottom: 0.25rem;
    }
    .statement-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    .statement-table th, .statement-table td {
      border: 1px solid black;
      padding: 0.5rem;
      text-align: left;
      font-size: 0.9rem;
    }
    .statement-table th {
      background-color: #f0f0f0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .statement-footer {
      display: flex;
      justify-content: flex-end;
    }
    .totals-table {
      width: 380px;
      border-collapse: collapse;
    }
    .totals-table th, .totals-table td {
      border: 1px solid black;
      padding: 0.5rem;
      text-align: right;
    }
    .totals-table th {
      background-color: #f0f0f0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      text-align: left;
    }
    .totals-table .grand-total {
      font-weight: bold;
      font-size: 1.1rem;
    }
    /* 參考列：已含在「前期累計應收未收」的淨額裡，不參與合計運算，
       以灰字與小注記提示客戶不要重複加總。 */
    .totals-table .ref-row th, .totals-table .ref-row td {
      color: #666;
      font-weight: normal;
    }
    .totals-table .ref-row small {
      font-size: 0.7rem;
      color: #888;
    }
    @media print {
      .statement-controls, .mobile-topbar, .sidebar, .sidebar-backdrop,
      .statement-tabs, .statement-hint, .statement-toolbar {
        display: none !important;
      }
      .container {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
      }
      .statement-preview {
        box-shadow: none;
        border: none;
        padding: 0;
      }
      /* 列印全部：顯示所有客戶，每位客戶各自分頁 */
      body.print-all .statement-section {
        display: block !important;
      }
      body.print-all .statement-section + .statement-section {
        break-before: page;
        page-break-before: always;
      }
      /* 列印勾選客戶：只輸出被勾選的，且各自分頁 */
      body.print-selected .statement-section {
        display: none !important;
      }
      body.print-selected .statement-section.is-selected {
        display: block !important;
      }
      body.print-selected .statement-section.is-selected ~ .statement-section.is-selected {
        break-before: page;
        page-break-before: always;
      }
    }
  </style>
  <script>
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  </script>
</head>
<body>

      </a>
      <a href="products.html" class="nav-item" data-page="products.html" title="商品管理">

        <span class="nav-label">收款管理</span>
      </a>
      <a href="statement.html" class="nav-item" data-page="statement.html" title="對帳單">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14h6"></path><path d="M9 18h6"></path><path d="M9 10h6"></path></svg>

      </a>
    </div>
    <button class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true">
      <svg class="chevron-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </nav>

  <div class="container">
    <div class="d-flex justify-between align-center mb-4 statement-controls">
      <h2>對帳單</h2>
    </div>

    <div class="glass-card mb-4 statement-controls">
      <div class="form-group">
        <label for="statement-date-from">開始日期</label>
        <input type="date" id="statement-date-from" class="form-control">
      </div>
      <div class="form-group">
        <label for="statement-date-to">結束日期</label>
        <input type="date" id="statement-date-to" class="form-control">
      </div>
      <button class="btn btn-primary" id="btn-search">查詢</button>
      <button class="btn btn-outline" id="btn-print-selected" disabled>列印選取</button>
      <button class="btn btn-outline" id="btn-print-all" disabled>列印全部</button>
    </div>

    <p id="statement-hint" class="statement-hint">請選擇日期區間後按「查詢」，系統會列出該期間有對帳單的客戶。</p>

    <div id="statement-toolbar" class="statement-toolbar" hidden>
      <label class="select-all-label checkbox">
        <input type="checkbox" id="select-all">
        <span class="checkbox-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </span>
        <span>全選</span>
      </label>
      <span id="select-count" class="select-count"></span>
    </div>

    <div id="statement-tabs" class="statement-tabs" role="tablist" aria-label="客戶對帳單"></div>

    <div id="statement-area"></div>
  </div>

  <script type="module" src="js/statement.js"></script>
</body>
</html>
