<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>對帳單 - 藝境裝潢材料行</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .statement-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .statement-controls .form-group {
      margin-bottom: 0;
    }
    /* 讓按鈕垂直 padding 與 .form-control（0.75rem）一致，使按鈕與日期 input 等高、上下對齊 */
    .statement-controls .btn {
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    .statement-hint {
      color: var(--text-muted, #718096);
      margin-bottom: 1rem;
    }
    .statement-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }
    /* 左欄客戶清單置頂常駐，右欄預覽很長時仍看得到清單與勾選 */
    .statement-sidebar {
      position: sticky;
      top: 1.5rem;
    }
    .statement-tabs {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      /* 客戶多時由清單自身捲動，不把整頁往下撐長 */
      max-height: calc(100vh - 12rem);
      overflow-y: auto;
    }
    .statement-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border-color);
    }
    .statement-toolbar[hidden] {
      display: none;
    }
    .select-all-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      cursor: pointer;
      user-select: none;
    }
    /* 核取方塊外觀改用全站共用的 .checkbox（見 style.css），不再自訂 input 尺寸 */
    .select-count {
      color: var(--text-muted, #718096);
      font-size: 0.9rem;
    }
    .statement-tab {
      display: flex;
      align-items: stretch;
      min-height: 48px;
      /* 左緣固定 3px：未選取為一般邊框色，is-active 時轉主色條標示目前檢視的客戶 */
      border: 2px solid var(--border-color);
      border-left-width: 3px;
      background: #fff;
      color: var(--text-main);
      font: inherit;
      transition: background-color var(--transition), border-color var(--transition);
    }
    .statement-tab:hover {
      background: var(--bg-page);
    }
    .statement-tab.is-active {
      border-left-color: var(--primary);
      background: var(--bg-card);
    }
    /* .tab-check 外觀改用全站共用的 .checkbox（見 style.css），置於整列最左 */
    .statement-tab .checkbox {
      padding: 0 0.5rem 0 0.6rem;
    }
    .tab-label {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 44px;
      padding: 0 0.75rem 0 0.25rem;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    /* 客戶名過長時省略，不撐破清單固定寬度。
       min-width: 0 是關鍵：flex item 預設 min-width 為 auto（內容寬），
       少了它名稱不肯收縮，會把右側餘額擠到換行甚至裁切（窄螢幕特別明顯）。 */
    .tab-label > span:first-child {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .statement-tab.is-active .tab-label {
      font-weight: 600;
    }
    .statement-tab .tab-balance {
      flex-shrink: 0;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* 餘額語意色：>0 為客戶欠款（中性醒目）、<0 為溢繳（成功色）、=0 已結清（弱化） */
    .tab-balance--due { color: var(--text-main); font-weight: 600; }
    .tab-balance--credit { color: var(--success); font-weight: 600; }
    .tab-balance--zero { color: var(--text-muted); }
    .statement-section[hidden] {
      display: none;
    }
    .statement-preview {
      background: white;
      padding: 2rem;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-hard);
      color: black;
    }
    .statement-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .statement-header h1 {
      justify-content: center;
      margin-bottom: 0.5rem;
    }
    .statement-header h1::before, .statement-header h2::before {
      display: none;
    }
    .statement-header h2 {
      justify-content: center;
      font-size: 1.5rem;
      color: #333;
    }
    .customer-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      border: 1px solid black;
      padding: 1rem;
    }
    .customer-info p {
      margin-bottom: 0.25rem;
    }
    /* 8 欄明細表塞不進窄螢幕時，讓表格自身橫向捲動，
       不外溢撐破預覽版面；桌機夠寬則不會出現捲軸。列印時另解除（見 @media print）。 */
    .statement-table-scroll {
      overflow-x: auto;
      margin-bottom: 2rem;
    }
    .statement-table {
      width: 100%;
      border-collapse: collapse;
    }
    .statement-table th, .statement-table td {
      border: 1px solid black;
      padding: 0.5rem;
      text-align: left;
      font-size: 0.9rem;
    }
    .statement-table th {
      background-color: #f0f0f0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .statement-footer {
      display: flex;
      justify-content: flex-end;
    }
    .totals-table {
      width: 380px;
      border-collapse: collapse;
    }
    .totals-table th, .totals-table td {
      border: 1px solid black;
      padding: 0.5rem;
      text-align: right;
    }
    .totals-table th {
      background-color: #f0f0f0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      text-align: left;
    }
    .totals-table .grand-total {
      font-weight: bold;
      font-size: 1.1rem;
    }
    /* 參考列：已含在「前期累計應收未收」的淨額裡，不參與合計運算，
       以灰字與小注記提示客戶不要重複加總。 */
    .totals-table .ref-row th, .totals-table .ref-row td {
      color: #666;
      font-weight: normal;
    }
    .totals-table .ref-row small {
      font-size: 0.7rem;
      color: #888;
    }
    /* 必須限定 screen：Chrome 列印時的 layout viewport 就是紙張可列印寬（直向 A4 約 700px），
       少了 screen 這段手機樣式會在列印時生效，合計表變滿版、客戶資訊改堆疊，
       印出來與畫面上的預覽對不起來。 */
    @media screen and (max-width: 768px) {
      /* 必須是 minmax(0, 1fr) 而非 1fr：1fr 的最小寬度是 auto（內容最寬處），
         預覽區的固定寬表格會把單欄撐到超出螢幕，連帶客戶清單一起水平溢出。
         鎖成 minmax(0, …) 才會把欄寬收回視窗寬，把溢出交還給各元素自行處理。 */
      .statement-layout {
        grid-template-columns: minmax(0, 1fr);
      }
      .statement-sidebar {
        position: static;
      }
      .statement-tabs {
        max-height: 40vh;
      }
      /* 窄螢幕縮小預覽內距，把寬度讓給明細內容 */
      .statement-preview {
        padding: 1rem;
      }
      /* 固定 380px 會直接溢出手機螢幕，改為滿版自適應 */
      .totals-table {
        width: 100%;
      }
      /* 客戶資訊兩欄改為可換行堆疊，避免窄螢幕互擠 */
      .customer-info {
        flex-wrap: wrap;
        gap: 0.75rem;
      }
    }
    /* 只設邊界、不設 size：Chrome 一旦看到 size 就會覆蓋使用者的選擇，並把列印對話框的
       版面配置下拉停用——以前寫死 landscape，就是為了讓直向（可列印寬約 700px）不要掉進
       手機斷點。斷點改成只在 screen 生效後，橫直向印出來都與畫面上的預覽一致，
       方向就還給列印的人決定：差別只在每頁放得下幾列明細。 */
    @page {
      margin: 12mm;
    }
    @media print {
      .statement-controls, .mobile-topbar, .sidebar, .sidebar-backdrop,
      .statement-sidebar, .statement-tabs, .statement-hint, .statement-toolbar {
        display: none !important;
      }
      /* 左欄整欄隱藏後，兩欄 grid 還原單欄，讓對帳單預覽佔滿版面寬度 */
      .statement-layout {
        display: block !important;
      }
      /* 必須是 body .container 而非 .container：style.css 也有一條列印隱藏 .container，
         兩邊同為 !important 且 specificity 相同時比的是先後順序，而 vite build 會把
         style.css 的 <link> 移到這段 inline <style> 之後——建置產物就會反過來由隱藏勝出，
         列印變成一張白紙（dev 看不出來，只有正式站會中）。多一層 body 拉高 specificity 就與順序無關。 */
      body .container {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
      }
      .statement-preview {
        box-shadow: none;
        border: none;
        padding: 0;
      }
      /* 列印須完整輸出明細，解除螢幕上的橫向捲動裁切 */
      .statement-table-scroll {
        overflow-x: visible;
      }
      /* 列印全部：顯示所有客戶，每位客戶各自分頁 */
      body.print-all .statement-section {
        display: block !important;
      }
      body.print-all .statement-section + .statement-section {
        break-before: page;
        page-break-before: always;
      }
      /* 列印勾選客戶：只輸出被勾選的，且各自分頁 */
      body.print-selected .statement-section {
        display: none !important;
      }
      body.print-selected .statement-section.is-selected {
        display: block !important;
      }
      body.print-selected .statement-section.is-selected ~ .statement-section.is-selected {
        break-before: page;
        page-break-before: always;
      }
    }
  </style>

    <div class="glass-card mb-4 statement-controls">
