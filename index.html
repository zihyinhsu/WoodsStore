<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>總覽 - 藝境裝潢材料行</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .product-link {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    .product-link:hover {
      text-decoration: underline;
    }
    .cost-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .cost-controls .form-group {
      margin-bottom: 0;
    }
    /* 讓按鈕垂直 padding 與 .form-control（0.75rem）一致，使按鈕與日期 input 等高、上下對齊 */
    .cost-controls .btn {
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    .cost-note {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 1rem;
    }
    .cost-sku {
      font-size: 0.8rem;
    }
    #cost-table th, #cost-table td {
      padding: 0.75rem 0.5rem;
    }
    #cost-table .num {
      font-family: 'Roboto', sans-serif;
      text-align: left;
      white-space: nowrap;
    }
    .cost-totals {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 2px solid var(--border-color);
    }
    .cost-totals[hidden] {
      display: none;
    }
    .cost-total-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .cost-total-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .cost-total-value {
      font-family: 'Roboto', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .cost-charts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }
    .cost-chart-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    /* chart.js 在 maintainAspectRatio:false 下靠外層容器決定高度，
       這裡給固定高度，canvas 才有可撐開的畫布，否則會塌成 0 高。 */
    .cost-chart-canvas {
      position: relative;
      height: 320px;
    }
    .cost-chart-empty {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 2rem 0;
      text-align: center;
    }
    @media (max-width: 1024px) {
      .grid-cols-4 {
        grid-template-columns: repeat(2, 1fr);
      }
      .cost-totals {
        grid-template-columns: repeat(2, 1fr);
      }
      .cost-charts {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 768px) {
      .cost-totals {
        grid-template-columns: 1fr;
      }
      .cost-chart-canvas {
        height: 260px;
      }
    }
  </style>
  <script>
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  </script>
</head>
<body>

    </button>
    <a href="index.html" class="mobile-brand">藝境裝潢材料行</a>
  </div>

    <div class="sidebar-backdrop"></div>

    <button class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true">
      <svg class="chevron-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

  <div class="container">
    <h2 class="mb-4">系統總覽</h2>
    
    <div class="grid grid-cols-4 gap-4 mb-4">
      <div class="glass-card stat-card">
        <div class="stat-label">本月進貨成本</div>
        <div class="stat-value is-money text-danger" id="stat-month-expense">-</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-label">本月出貨收益</div>
        <div class="stat-value is-money text-success" id="stat-month-revenue">-</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-label">本月出貨成本</div>
        <div class="stat-value is-money" id="stat-month-cost">-</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-label">本月毛利</div>
        <div class="stat-value is-money" id="stat-month-profit">-</div>
      </div>
    </div>

    <h3 class="mb-3">進出貨成本分析</h3>

    <div class="glass-card mb-4 cost-controls">
      <div class="form-group">
        <label for="cost-date-from">開始日期</label>
        <input type="date" id="cost-date-from" class="form-control">
      </div>
      <div class="form-group">
        <label for="cost-date-to">結束日期</label>
        <input type="date" id="cost-date-to" class="form-control">
      </div>
      <button class="btn btn-primary" id="btn-cost-search">查詢</button>
    </div>

    <div class="tabs" role="tablist" aria-label="進出貨成本分析檢視">
      <button class="tab-btn active" data-view="charts" role="tab" aria-selected="true" aria-controls="cost-panel-charts">圖表分析</button>
      <button class="tab-btn" data-view="table" role="tab" aria-selected="false" aria-controls="cost-panel-table">明細清單</button>
    </div>

    <div class="glass-card mb-4 cost-charts tab-panel" id="cost-panel-charts" data-view-panel="charts" role="tabpanel">
      <div class="cost-chart-block">
        <h4 class="cost-chart-title">進出貨趨勢（按月）</h4>
        <p class="cost-chart-empty" id="cost-trend-empty" hidden>此期間沒有進出貨紀錄</p>
        <div class="cost-chart-canvas">
          <canvas id="cost-trend-chart"></canvas>
        </div>
      </div>
      <div class="cost-chart-block">
        <h4 class="cost-chart-title">商品毛利排行</h4>
        <p class="cost-chart-empty" id="cost-ranking-empty" hidden>此期間沒有進出貨紀錄</p>
        <div class="cost-chart-canvas">
          <canvas id="cost-ranking-chart"></canvas>
        </div>
      </div>
    </div>

    <div class="glass-card tab-panel" id="cost-panel-table" data-view-panel="table" role="tabpanel" hidden>
      <div class="table-responsive">
        <table id="cost-table">
          <thead>
            <tr>
              <th>商品</th>
              <th>進貨數量</th>
              <th>進貨金額</th>
              <th>出貨數量</th>
              <th>出貨金額</th>
              <th>出貨成本</th>
              <th>毛利</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="7" class="empty-state">載入中...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="cost-totals" id="cost-totals" hidden>
        <div class="cost-total-item">
          <span class="cost-total-label">期間進貨成本</span>
          <span class="cost-total-value" id="cost-total-purchase">-</span>
        </div>
        <div class="cost-total-item">
          <span class="cost-total-label">期間出貨收益</span>
          <span class="cost-total-value" id="cost-total-sale">-</span>
        </div>
        <div class="cost-total-item">
          <span class="cost-total-label">期間出貨成本</span>
          <span class="cost-total-value" id="cost-total-cost">-</span>
        </div>
        <div class="cost-total-item">
          <span class="cost-total-label">期間毛利</span>
          <span class="cost-total-value" id="cost-total-profit">-</span>
        </div>
      </div>

      <div class="pagination">
        <button class="btn btn-outline" id="btn-cost-prev" disabled>上一頁</button>
        <span id="cost-page-info">-</span>
        <button class="btn btn-outline" id="btn-cost-next" disabled>下一頁</button>
      </div>

      <p class="cost-note">
        出貨成本於確認出貨時記下、之後不變；所有金額皆已扣整單折讓、未加稅，與上方卡片同一口徑。
      </p>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
