<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收款管理 - 藝境裝潢材料行</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .balance-table th, .balance-table td {
      padding: 0.5rem;
      font-size: 0.9rem;
    }
    .balance-table .balance-amount {
      font-weight: bold;
    }
    .balance-table .balance-amount.positive {
      color: var(--warning);
    }
    /* 負餘額代表客戶溢付、是我方負債，與一般未收款反向，用不同顏色區隔 */
    .balance-table .balance-amount.negative {
      color: var(--danger);
    }

    .clickable-row {
      cursor: pointer;
    }
    .detail-row {
      background: rgba(31, 31, 31, 0.03);
    }
    .detail-table {
      width: 100%;
      background: white;
      border-radius: 0;
      border: 2px solid var(--border-color);
      margin: 0.5rem 0;
    }
    .detail-table th, .detail-table td {
      padding: 0.5rem;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border-light);
    }
    .detail-table th {
      border-bottom: 2px solid var(--border-color);
    }
    /* 從單據頁帶 order_id 進來時，標出使用者要找的那張單，
       一筆收款可能沖多張單，不標很難一眼認出目標。 */
    .detail-table tr.is-highlighted {
      background: rgba(246, 173, 85, 0.18);
      font-weight: 600;
    }

    .balance-header {
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    /* 應收餘額是全期間累計到截止日的快照，與上方搜尋列的「區間」語意不同，
       這行提示不可省略，否則兩張表的數字對不起來會被誤判為 bug。 */
    .balance-asof-hint {
      margin: 0.25rem 0 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .balance-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .balance-keyword {
      width: 240px;
      height: 38px;
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      .balance-controls {
        width: 100%;
      }
      .balance-keyword {
        width: 100%;
      }
    }
    .balance-settled-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }
    /* 核取方塊外觀改用全站共用的 .checkbox（見 style.css），這裡不再自訂 input 尺寸 */

    /* Search Bar Styles */
    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
    }
    .search-bar .form-group {
      margin-bottom: 0;
      flex: 0 0 auto;
    }
    .search-bar .form-group label {
      font-size: 0.8rem;
      margin-bottom: 0.25rem;
    }
    .search-bar .form-control {
      padding: 0.4rem 0.6rem;
      height: 38px;
      font-size: 0.9rem;
    }
    .search-bar .btn {
      padding: 0 1rem;
      white-space: nowrap;
      height: 38px;
      font-size: 0.9rem;
    }

    /* Field Widths */
    .search-date-group { width: 150px; }
    .search-select-group { width: 150px; }
    .search-keyword-group {
      flex: 1;
      min-width: 200px;
    }
    
    @media (max-width: 768px) {
      .search-date-group, .search-select-group, .search-keyword-group {
        width: 100%;
        flex: 1 1 100%;
      }
      .search-bar .btn {
        width: 100%;
        flex: 1 1 100%;
      }
    }
  </style>
  <script>
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  </script>
</head>
<body>
  <div class="mobile-topbar">
    <button class="btn-menu" aria-label="開啟選單" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <a href="index.html" class="mobile-brand">藝境裝潢材料行</a>
  </div>

  <div class="sidebar-backdrop"></div>
  <nav class="sidebar" aria-label="主選單">
    <a href="index.html" class="sidebar-brand">
      <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h13"></path><path d="M6 10h13"></path><path d="M19 4a2 3 0 0 1 0 6"></path><ellipse cx="6" cy="7" rx="2" ry="3"></ellipse><path d="M6 14h13"></path><path d="M6 20h13"></path><path d="M19 14a2 3 0 0 1 0 6"></path><ellipse cx="6" cy="17" rx="2" ry="3"></ellipse></svg>
      <span class="brand-text">藝境裝潢材料行</span>
    </a>
    <div class="sidebar-nav">
      <a href="index.html" class="nav-item" data-page="index.html" title="總覽">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span class="nav-label">總覽</span>
      </a>
      <a href="products.html" class="nav-item" data-page="products.html" title="商品管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <span class="nav-label">商品管理</span>
      </a>
      <a href="orders.html" class="nav-item" data-page="orders.html" title="單據管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span class="nav-label">單據管理</span>
      </a>
      <a href="payments.html" class="nav-item" data-page="payments.html" title="收款管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><line x1="12" y1="18" x2="12" y2="6"></line></svg>
        <span class="nav-label">收款管理</span>
      </a>
      <a href="statement.html" class="nav-item" data-page="statement.html" title="對帳單">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14h6"></path><path d="M9 18h6"></path><path d="M9 10h6"></path></svg>
        <span class="nav-label">對帳單</span>
      </a>
      <a href="partners.html" class="nav-item" data-page="partners.html" title="往來對象">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span class="nav-label">往來對象</span>
      </a>
    </div>
    <button class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true">
      <svg class="chevron-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </nav>

  <div class="container">
    <div class="d-flex justify-between align-center mb-4">
      <h2>收款管理</h2>
      <button class="btn btn-primary" id="btn-add-payment">新增收款</button>
    </div>

    <div class="glass-card mb-4">
      <div class="search-bar">
        <div class="form-group search-date-group">
          <label>開始日期</label>
          <input type="date" id="search-date-from" class="form-control">
        </div>
        <div class="form-group search-date-group">
          <label>結束日期</label>
          <input type="date" id="search-date-to" class="form-control">
        </div>
        <div class="form-group search-select-group">
          <label>客戶</label>
          <select id="search-partner" class="form-control">
            <option value="all">全部</option>
          </select>
        </div>
        <div class="form-group search-select-group">
          <label>收款方式</label>
          <select id="search-method" class="form-control">
            <option value="all">全部</option>
            <option value="cash">現金</option>
            <option value="transfer">匯款</option>
            <option value="check">支票</option>
          </select>
        </div>
        <div class="form-group search-keyword-group">
          <label>關鍵字搜尋</label>
          <input type="text" id="search-keyword" class="form-control" placeholder="收款單號、客戶、出貨單號、備註...">
        </div>
        <button class="btn btn-outline" id="btn-reset-search">清除條件</button>
      </div>
      <div id="order-filter-notice" class="mt-3" style="display: none;"></div>
    </div>

    <div class="glass-card">
      <h3 class="mb-3">收款紀錄</h3>
      <div class="table-responsive">
        <table id="payments-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>收款單號</th>
              <th>客戶</th>
              <th>金額</th>
              <th>方式</th>
              <th>備註</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="7" class="empty-state">載入中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="btn btn-outline" id="btn-prev-page" disabled>上一頁</button>
        <span id="page-info">第 1 頁</span>
        <button class="btn btn-outline" id="btn-next-page" disabled>下一頁</button>
      </div>
    </div>

    <div class="glass-card mt-4">
      <div class="d-flex justify-between align-center mb-3 balance-header">
        <div>
          <h3 class="mb-0">客戶應收餘額</h3>
          <p id="balance-asof-hint" class="balance-asof-hint"></p>
        </div>
        <div class="balance-controls">
          <input type="text" id="balance-keyword" class="form-control balance-keyword"
                 placeholder="搜尋客戶編號、名稱、統編...">
          <label class="balance-settled-toggle checkbox">
            <input type="checkbox" id="toggle-settled">
            <span class="checkbox-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            <span>顯示已結清客戶</span>
          </label>
        </div>
      </div>
      <div class="table-responsive">
        <table class="balance-table" id="balance-table">
          <thead>
            <tr>
              <th>客戶編號</th>
              <th>名稱</th>
              <th>出貨總額</th>
              <th>已收款</th>
              <th>應收餘額</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="5" class="empty-state">載入中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="btn btn-outline" id="btn-balance-prev" disabled>上一頁</button>
        <span id="balance-page-info">第 1 頁</span>
        <button class="btn btn-outline" id="btn-balance-next" disabled>下一頁</button>
      </div>
    </div>
  </div>

  <!-- Payment Modal -->
  <div class="modal-overlay" id="payment-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="payment-modal-title">新增收款</h3>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="payment-form">
          <input type="hidden" id="payment-id">
          <div class="form-group">
            <label>客戶</label>
            <select id="payment-partner" class="form-control" required>
              <option value="">請選擇...</option>
            </select>
            <div id="partner-balance-hint" class="mt-2" style="font-size: 0.85rem; display: none;"></div>
          </div>
          <div class="form-group">
            <label>收款日期</label>
            <input type="date" id="payment-date" class="form-control" required>
          </div>
          <div class="form-group">
            <label>收款出貨單</label>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">
              勾選這次收款結清的出貨單，收款金額自動加總。
            </div>
            <!-- 明細預設展開，每列高度是原本的數倍，240px 只看得到一張單 -->
            <div id="payment-orders-list" style="max-height: 360px; overflow-y: auto; border: 2px solid var(--border-color); padding: 0.5rem; margin-bottom: 0.5rem;">
              <div class="empty-state" style="padding: 1rem 0;">請先選擇客戶</div>
            </div>
            <!-- 金額是勾選結果的推導值，不給使用者輸入：一旦金額與分配是兩個各自
                 獨立的數字，就會產生「湊平」的負擔與湊不平的各種錯誤狀態。 -->
            <input type="hidden" id="payment-amount">
            <div style="text-align: right; font-size: 0.9rem;">
              收款金額
              <strong id="payment-amount-display" style="font-family: 'Roboto', sans-serif; font-size: 1.1rem;">$0</strong>
            </div>
            <div id="payment-legacy-hint" class="text-warning" style="font-size: 0.85rem; margin-top: 0.5rem; display: none;"></div>
          </div>
          <div class="form-group">
            <label>收款方式</label>
            <select id="payment-method" class="form-control" required>
              <option value="cash">現金</option>
              <option value="transfer">匯款</option>
              <option value="check">支票</option>
            </select>
          </div>
          <div class="form-group">
            <label>備註</label>
            <input type="text" id="payment-note" class="form-control">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline close-btn">取消</button>
        <button class="btn btn-primary" id="btn-save-payment">儲存</button>
      </div>
    </div>
  </div>

  <!-- Print Area -->
  <div id="print-area"></div>

  <script type="module" src="js/payments.js"></script>
</body>
</html>
