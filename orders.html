<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單據管理 - 藝境裝潢材料行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .search-bar .form-group {
      margin-bottom: 0;
    }
    .quick-ranges {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .quick-ranges button {
      background: none;
      border: 2px solid var(--border-color);
      color: var(--text-main);
      border-radius: 0;
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 2px 2px 0 rgba(31, 31, 31, 0.15);
    }
    .quick-ranges button:hover {
      background: var(--primary);
      color: white;
      border-color: var(--border-color);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 rgba(31, 31, 31, 0.2);
    }
    .line-item-row {
      display: grid;
      grid-template-columns: 3fr 1.5fr 1fr 1.5fr 1fr 1.5fr auto;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .hide-prices .price-col {
      display: none !important;
    }
    .hide-prices .line-item-row {
      grid-template-columns: 3fr 1.5fr 1fr auto;
    }
    .hide-prices .totals-section {
      display: none !important;
    }
    .line-item-header {
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }
    .clickable-row {
      cursor: pointer;
    }
    .detail-row {
      background: rgba(31, 31, 31, 0.03);
    }
    .detail-table {
      width: 100%;
      background: white;
      border-radius: 0;
      border: 2px solid var(--border-color);
      margin: 0.5rem 0;
    }
    .detail-table th, .detail-table td {
      padding: 0.5rem;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border-light);
    }
    .detail-table th {
      border-bottom: 2px solid var(--border-color);
    }
  </style>
  <script>
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  </script>
</head>
<body>
    <div class="mobile-topbar">
    <button class="btn-menu" aria-label="開啟選單" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <a href="index.html" class="mobile-brand">藝境裝潢材料行</a>
  </div>

    <div class="sidebar-backdrop"></div>
  <nav class="sidebar" aria-label="主選單">
    <a href="index.html" class="sidebar-brand">
      <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      <span class="brand-text">藝境裝潢材料行</span>
    </a>
    <div class="sidebar-nav">
      <a href="index.html" class="nav-item" data-page="index.html" title="總覽">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span class="nav-label">總覽</span>
      </a>
      <a href="products.html" class="nav-item" data-page="products.html" title="商品管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <span class="nav-label">商品管理</span>
      </a>
      <a href="orders.html" class="nav-item" data-page="orders.html" title="單據管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span class="nav-label">單據管理</span>
      </a>
      <a href="payments.html" class="nav-item" data-page="payments.html" title="收款管理">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><line x1="12" y1="18" x2="12" y2="6"></line></svg>
        <span class="nav-label">收款管理</span>
      </a>
      <a href="statement.html" class="nav-item" data-page="statement.html" title="對帳單">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14h6"></path><path d="M9 18h6"></path><path d="M9 10h6"></path></svg>
        <span class="nav-label">對帳單</span>
      </a>
      <a href="partners.html" class="nav-item" data-page="partners.html" title="往來對象">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span class="nav-label">往來對象</span>
      </a>
    </div>
    <button class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true">
      <svg class="chevron-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </nav>

  <div class="container">
    <div class="d-flex justify-between align-center mb-4">
      <h2>單據管理</h2>
      <button class="btn btn-primary" id="btn-add-order">新增單據</button>
    </div>

    <div class="glass-card mb-4">
      <div class="search-bar">
        <div class="form-group">
          <label>開始日期</label>
          <input type="date" id="search-date-from" class="form-control">
        </div>
        <div class="form-group">
          <label>結束日期</label>
          <input type="date" id="search-date-to" class="form-control">
        </div>
        <div class="form-group">
          <label>類型</label>
          <select id="search-type" class="form-control">
            <option value="all">全部</option>
            <option value="purchase">進貨</option>
            <option value="sale">出貨</option>
            <option value="adjust">調整</option>
          </select>
        </div>
        <div class="form-group">
          <label>狀態</label>
          <select id="search-status" class="form-control">
            <option value="active">有效 (草稿+確認)</option>
            <option value="confirmed">已確認</option>
            <option value="draft">草稿</option>
            <option value="void">已作廢</option>
            <option value="all">全部</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1; min-width: 200px;">
          <label>關鍵字搜尋</label>
          <input type="text" id="search-keyword" class="form-control" placeholder="單號、對象、商品...">
        </div>
      </div>
      <div class="quick-ranges">
        <button data-range="today">今天</button>
        <button data-range="thisWeek">本週</button>
        <button data-range="thisMonth">本月</button>
        <button data-range="lastMonth">上月</button>
      </div>
    </div>

    <div class="glass-card">
      <div class="table-responsive">
        <table id="orders-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>單號</th>
              <th>類型</th>
              <th>狀態</th>
              <th>往來對象</th>
              <th>品項數</th>
              <th>總金額</th>
              <th>付款狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="9" class="empty-state">載入中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="btn btn-outline" id="btn-prev-page" disabled>上一頁</button>
        <span id="page-info">第 1 頁</span>
        <button class="btn btn-outline" id="btn-next-page" disabled>下一頁</button>
      </div>
    </div>
  </div>

  <!-- Order Modal -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h3>新增單據</h3>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="order-form">
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="form-group">
              <label>單據類型</label>
              <select id="order-type" class="form-control" required>
                <option value="sale">出貨單</option>
                <option value="purchase">進貨單</option>
                <option value="adjust">調整單</option>
              </select>
            </div>
            <div class="form-group">
              <label>單據日期</label>
              <input type="date" id="order-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label>往來對象</label>
              <select id="order-partner" class="form-control">
                <option value="">請選擇...</option>
              </select>
            </div>
            <div class="form-group">
              <label>備註</label>
              <input type="text" id="order-note" class="form-control">
            </div>
          </div>

          <div class="mb-2 d-flex justify-between align-center">
            <h4>單據明細</h4>
            <button type="button" class="btn btn-outline" id="btn-add-line">加入商品</button>
          </div>
          
          <div class="line-item-row line-item-header">
            <div>商品</div>
            <div>規格/單位</div>
            <div>數量</div>
            <div class="price-col">單價</div>
            <div class="price-col">折扣(%)</div>
            <div class="price-col">小計</div>
            <div></div>
          </div>
          
          <div id="order-lines">
            <!-- Line items will be added here -->
          </div>

          <div class="d-flex justify-between align-center mt-4 pt-3 totals-section" style="border-top: 2px solid var(--border-color);">
            <div class="d-flex gap-3">
              <div class="form-group mb-0">
                <label>整單折讓</label>
                <input type="number" id="order-discount" class="form-control" value="0" min="0" style="width: 100px;">
              </div>
              <div class="form-group mb-0">
                <label>稅額</label>
                <input type="number" id="order-tax" class="form-control" value="0" min="0" style="width: 100px;">
              </div>
            </div>
            <div class="text-right">
              <div class="text-muted" style="font-weight: 600;">總計金額</div>
              <div style="font-size: 2rem; font-weight: bold; color: var(--primary); font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px;" id="order-total-display">NT$ 0</div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline close-btn">取消</button>
        <button class="btn btn-outline" id="btn-save-draft">存為草稿</button>
        <button class="btn btn-primary" id="btn-save-order">建立單據</button>
      </div>
    </div>
  </div>

  <!-- Print Area -->
  <div id="print-area"></div>

  <script type="module" src="js/orders.js"></script>
</body>
</html>
