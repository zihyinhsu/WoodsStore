    <button class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true">

  <div class="container">
    <div class="d-flex justify-between align-center mb-4">
      <h2>往來對象</h2>
      <button class="btn btn-primary" id="btn-add-partner">新增對象</button>
    </div>

    <div class="glass-card">
      <div class="tabs" id="partner-tabs">
        <button class="tab-btn active" data-type="supplier">供應商</button>
        <button class="tab-btn" data-type="customer">客戶</button>
      </div>

      <div class="table-responsive">
        <table id="partners-table">
          <thead>
            <tr>
              <th>編號</th>
              <th>名稱</th>
              <th>統編</th>
              <th>聯絡人</th>
              <th>電話</th>
              <th>付款條件</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="7" class="empty-state">載入中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="btn btn-outline" id="btn-prev-page" disabled>上一頁</button>
        <span id="page-info">第 1 頁</span>
        <button class="btn btn-outline" id="btn-next-page" disabled>下一頁</button>
      </div>
    </div>
  </div>

  <!-- Partner Modal -->
  <div class="modal-overlay" id="partner-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">新增對象</h3>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="partner-form">
          <input type="hidden" id="partner-id">
          <div class="grid grid-cols-2 gap-3">
            <div class="form-group">
              <label>類型</label>
              <select id="partner-type" class="form-control">
                <option value="supplier">供應商</option>
                <option value="customer">客戶</option>
              </select>
            </div>
            <div class="form-group">
              <label>名稱 (必填)</label>
              <input type="text" id="partner-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="partner-no">編號</label>
              <input type="text" id="partner-no" class="form-control" placeholder="儲存後自動產生">
              <small id="partner-no-hint" class="text-muted">留空將自動編號（客戶 C0001、供應商 S0001 起）</small>
            </div>
            <div class="form-group">
              <label>統一編號</label>
              <input type="text" id="partner-tax-id" class="form-control">
            </div>
            <div class="form-group">
              <label>聯絡人</label>
              <input type="text" id="partner-contact-name" class="form-control">
            </div>
            <div class="form-group">
              <label>電話</label>
              <input type="text" id="partner-phone" class="form-control">
            </div>
            <div class="form-group">
              <label>付款條件</label>
              <input type="text" id="partner-payment-terms" class="form-control" placeholder="例：月結30天">
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>地址</label>
              <input type="text" id="partner-address" class="form-control">
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>備註</label>
              <input type="text" id="partner-note" class="form-control">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline close-btn">取消</button>
        <button class="btn btn-primary" id="btn-save-partner">儲存</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/partners.js"></script>
</body>
</html>
